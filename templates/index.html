<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 靶向分子设计平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <!-- 侧边导航栏 -->
    <aside class="sidebar">
        <header class="sidebar-header">
            <h4><i class="bi bi-capsule-pill"></i> 智能分子平台</h4>
        </header>
        <nav class="nav-menu">
            <div class="nav-item active" onclick="switchTab('genPanel', this)"><i class="bi bi-cpu"></i> 分子生成服务</div>
            <div class="nav-item" onclick="switchTab('trainPanel', this)"><i class="bi bi-database-add"></i> 模型训练管理</div>
        </nav>
    </aside>

    <!-- 主内容区域 -->
    <main class="content">
        <!-- 分子生成面板 -->
        <section id="genPanel">
            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="card p-4">
                        <h5 class="mb-4">生成配置</h5>
                        <div class="mb-3">
                            <label class="form-label">选择生成模型</label>
                            <select id="modelSelect" class="form-select mb-2"></select>
                            <button class="btn btn-sm btn-link p-0" onclick="loadModels()">刷新列表</button>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">优化目标设置</label>
                            <select id="targetSelect" class="form-select">
                                <option value="random">🎲 随机探索模式</option>
                                <option value="high_qed">💊 目标：高类药性 (High QED)</option>
                                <option value="high_logp">💧 目标：高脂溶性 (High LogP)</option>
                            </select>
                        </div>
                        <button id="genBtn" class="btn btn-primary btn-lg w-100 py-3">执行生成</button>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div class="card p-4 h-100">
                        <div id="emptyState" class="text-center py-5">
                            <i class="bi bi-virus display-1 text-light"></i>
                            <p class="mt-3 text-muted">等待任务启动...</p>
                        </div>
                        <div id="resultDisplay" style="display:none;">
                            <div class="row align-items-center">
                                <div class="col-md-6 text-center border-end">
                                    <img id="molImg" src="" alt="分子结构">
                                    <div class="mt-3 px-3"><div id="smilesCode" class="bg-light p-2 rounded text-break small font-monospace"></div></div>
                                </div>
                                <div class="col-md-6 px-4">
                                    <h6 class="mb-3 text-primary">理化性质报告</h6>
                                    <div class="row g-3">
                                        <div class="col-6"><div class="prop-box"><div class="prop-label">QED</div><div id="qedVal" class="prop-val">--</div></div></div>
                                        <div class="col-6"><div class="prop-box"><div class="prop-label">LogP</div><div id="logpVal" class="prop-val">--</div></div></div>
                                        <div class="col-6"><div class="prop-box"><div class="prop-label">MW</div><div id="mwVal" class="prop-val">--</div></div></div>
                                        <div class="col-6"><div class="prop-box"><div class="prop-label">状态</div><div class="text-success small fw-bold mt-1">已校验</div></div></div>
                                    </div>
                                    <div class="mt-4 p-3 border-start border-4 border-primary bg-light"><small id="moreMetrics" class="text-dark"></small></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 模型训练面板 -->
        <section id="trainPanel" style="display:none;">
            <div class="card p-4 mx-auto" style="max-width: 800px;">
                <h4 class="mb-4 text-primary"><i class="bi bi-gear-fill"></i> 模型训练配置中心</h4>
                <form id="trainForm">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-bold">1. 自定义模型名称</label>
                            <input type="text" name="model_name" class="form-control" placeholder="例如: my_vae_model" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">2. 训练轮次 (Epochs)</label>
                            <input type="number" name="epochs" class="form-control" value="10">
                        </div>
                      <div class="col-md-6">
    <label class="form-label fw-bold">3. 学习率 (LR)</label>
    <input type="number" name="lr" class="form-control"
           value="0.001" step="0.0001" min="0" max="0.1"
           placeholder="例如: 0.0005">
    <div class="form-text">建议范围: 0.0001 - 0.01</div>
</div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">4. 批次大小 (Batch Size)</label>
                            <input type="number" name="batch_size" class="form-control" value="32">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">5. 隐藏层维度</label>
                            <select name="hidden_dim" class="form-select">
                                <option value="32">32</option>
                                <option value="64" selected>64</option>
                                <option value="128">128</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">6. 上传数据集 (.smi)</label>
                            <input type="file" name="dataset" class="form-control" required>
                        </div>
                    </div>
                    <button type="submit" id="trainBtn" class="btn btn-success btn-lg w-100 mt-4 py-3">
                        <i class="bi bi-rocket-takeoff"></i> 启动异步训练任务
                    </button>
                </form>

                <div id="trainNotify" class="mt-4 d-none">
                    <div class="d-flex justify-content-between">
                        <strong id="statusText" class="text-primary">准备中...</strong>
                    </div>
                    <div class="progress mt-2" style="height: 10px;">
                        <div id="trainProgressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 0%;"></div>
                    </div>
                    <div id="trainLogs"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="/static/js/main.js"></script>
</body>
</html>
